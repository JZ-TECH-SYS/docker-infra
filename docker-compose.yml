# 
#  Infraestrutura Compartilhada - MySQL + phpMyAdmin
# 

services:
  mysql:
    image: mysql:8.0
    container_name: mysql_shared
    command:
      - --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql/init:/docker-entrypoint-initdb.d:ro
      - ./mysql/conf.d:/etc/mysql/conf.d:ro
    tmpfs:
      - /tmp
    mem_limit: 1g
    cpus: 2.0
    networks:
      - shared_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 20s
      timeout: 3s
      retries: 5
      start_period: 25s
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: phpmyadmin_shared
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      PMA_USER: root
      PMA_PASSWORD: root
      UPLOAD_LIMIT: 100M
    ports:
      - "8090:80"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - shared_network
    mem_limit: 256m
    cpus: 0.50
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  infra_monitor:
    build:
      context: .
      dockerfile: Dockerfile.monitor
    container_name: infra_doctor_monitor
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      MONITOR_INTERVAL_SECONDS: 30
      LOG_RETENTION_DAYS: 14
      LOG_DIR: /logs
      AUTO_HEAL_ENABLED: 1
      AUTO_HEAL_COOLDOWN_SECONDS: 120
      STATE_DIR: /logs/.state
      TZ: America/Sao_Paulo
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./monitor-logs:/logs
    networks:
      - shared_network
    mem_limit: 128m
    cpus: 0.25
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  mysql_data:
    name: mysql_shared_data

networks:
  shared_network:
    name: shared_network
    driver: bridge
