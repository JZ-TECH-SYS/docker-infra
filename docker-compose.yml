# 
#  Infraestrutura Compartilhada - MySQL + phpMyAdmin
# 

services:
  mysql:
    image: mysql:8.0
    container_name: mysql_shared
    command:
      - --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql/init:/docker-entrypoint-initdb.d:ro
      - ./mysql/conf.d:/etc/mysql/conf.d:ro
    tmpfs:
      - /tmp
    mem_limit: 1g
    cpus: 2.0
    networks:
      - shared_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 20s
      timeout: 3s
      retries: 5
      start_period: 25s
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: phpmyadmin_shared
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      PMA_USER: root
      PMA_PASSWORD: root
      UPLOAD_LIMIT: 100M
    ports:
      - "8090:80"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - shared_network
    mem_limit: 256m
    cpus: 0.50
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  postgres:
    image: postgres:17
    container_name: postgres_shared
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: root
      POSTGRES_DB: postgres
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    tmpfs:
      - /tmp
    mem_limit: 768m
    cpus: 1.5
    networks:
      - shared_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: pgadmin_shared
    entrypoint: ["/bin/sh", "/pgadmin4/entrypoint-with-pgpass.sh"]
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@local.dev
      PGADMIN_DEFAULT_PASSWORD: root
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
    ports:
      - "8092:80"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - pgadmin_data:/var/lib/pgadmin
      - ./pgadmin/entrypoint-with-pgpass.sh:/pgadmin4/entrypoint-with-pgpass.sh:ro
      - ./pgadmin/bootstrap_pgadmin.py:/pgadmin4/bootstrap_pgadmin.py:ro
      - ./pgadmin/pgpass:/pgadmin4/pgpass:ro
    networks:
      - shared_network
    mem_limit: 256m
    cpus: 0.50
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  infra_monitor:
    build:
      context: .
      dockerfile: Dockerfile.monitor
    container_name: infra_doctor_monitor
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      MONITOR_INTERVAL_SECONDS: 120
      LOG_RETENTION_DAYS: 14
      LOG_DIR: /logs
      AUTO_HEAL_ENABLED: 1
      AUTO_HEAL_COOLDOWN_SECONDS: 300
      STATE_DIR: /logs/.state
      TZ: America/Sao_Paulo
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./monitor-logs:/logs
    networks:
      - shared_network
    mem_limit: 192m
    cpus: 0.50
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  mysql_data:
    name: mysql_shared_data
  postgres_data:
    name: postgres_shared_data
  pgadmin_data:
    name: pgadmin_shared_data

networks:
  shared_network:
    name: shared_network
    driver: bridge
