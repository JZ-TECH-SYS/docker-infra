[www]
listen = 127.0.0.1:9000

; === MODO ONDEMAND: ideal para DEV com múltiplos projetos ===
; Workers são criados SOMENTE quando chega request e morrem após 10s idle
; Isso evita 10+ projetos × N workers ociosos consumindo RAM
pm = ondemand
pm.max_children = 10
pm.process_idle_timeout = 10s
pm.max_requests = 500

; Timeout para requests longos
request_terminate_timeout = 300s
