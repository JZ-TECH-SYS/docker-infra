server {
    listen 80;
    server_name localhost;
    
    # Raíz parametrizada da aplicação (será setada no start do container)
    root /var/www/html/public;
    index index.php index.html index.htm;

    # Keepalive - reutilizar conexões TCP (navegador não precisa re-handshake)
    keepalive_timeout 30;
    keepalive_requests 100;

    # Cache de metadata de arquivos no Nginx (evita stat() no disco a cada request)
    open_file_cache max=2000 inactive=20s;
    open_file_cache_valid 30s;
    open_file_cache_min_uses 2;
    open_file_cache_errors on;

    # Gzip para respostas JSON (sua API retorna MUITO json)
    gzip on;
    gzip_types application/json text/plain text/css application/javascript;
    gzip_min_length 256;
    gzip_comp_level 4;

    # Headers de segurança básicos
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-XSS-Protection "1";
    add_header X-Content-Type-Options "1";

    location / {
        try_files $uri $uri/ @webapp;
    }

    location @webapp {
        rewrite ^/(.*)$ /index.php?request=$1&$args last;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    # Desabilitar log para assets estáticos e colocar cache alto
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|webp|svg|woff|woff2|ttf|eot)$ {
        expires max;
        access_log off;
        log_not_found off;
    }

    # Passar requests PHP para o PHP-FPM
    location ~ \.php$ {
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_hide_header X-Powered-By;

        # Keepalive no upstream FPM
        fastcgi_keep_conn on;

        # Evitar timeout em cron/debug
        fastcgi_read_timeout 300s;
        fastcgi_buffer_size 128k;
        fastcgi_buffers 4 256k;
        fastcgi_busy_buffers_size 256k;
    }

    location ~ /\.ht {
        deny all;
    }
}
