#
#  EXEMPLO: Como adicionar projeto2
#

# Nome do projeto (containers ficarão dentro de "api")
name: api

services:
  api:
    # ← aqui colocar nome do projeto ex. clickjoias etc...!
    image: api_mvc:latest #  Usa a IMAGEM BASE que você builda neste repo
    container_name: projeto2_api #  Mude o nome para o seu projeto
    init: true
    volumes:
      - ./api:/var/www/html:cached
      - projeto2_vendor:/var/www/html/vendor
    ports:
      - "8091:80" #  Mude a porta conforme desejar
    environment:
      DB_HOST: mysql_shared #  Host do MySQL compartilhado (nome do container)
      DB_PORT: 3306 #  Porta interna na rede compartilhada
      DB_NAME: projeto2 #  Mude o database
      DB_USER: root
      DB_PASS: root
      COMPOSER_MEMORY_LIMIT: -1
    networks:
      - shared_network
    command: >
      sh -c "
        if [ ! -f 'vendor/autoload.php' ]; then
          composer install --no-interaction --prefer-dist --optimize-autoloader --no-progress;
        fi &&
        /usr/local/bin/entrypoint.sh
      "
    # === RESOURCE LIMITS (obrigatório em WSL2!) ===
    # Sem limits, 10 projetos rodando = cada um come RAM infinita = swap thrash
    mem_limit: 384m
    cpus: 1.5
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

# ✅ Define a rede externa (criada pelo docker-infra)
networks:
  shared_network:
    external: true

volumes:
  projeto2_vendor:
